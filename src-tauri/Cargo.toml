[package]
name = "keel"
version = "0.1.0"
description = "A desktop workspace for running many AI coding agents at once."
authors = ["alede"]
license = "MIT"
repository = "https://github.com/aledlb8/keel"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "keel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
ignore = "0.4"
regex = "1"
notify = "8"
notify-debouncer-mini = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
socket2 = "0.5"
time = { version = "0.3", default-features = false, features = ["parsing"] }

[target.'cfg(windows)'.dependencies]
# Same version tauri/wry already selected; needed for ICoreWebView2Settings3.
webview2-com = "0.39.1"
windows-core = "0.61"
winapi = { version = "0.3", features = [
    "tlhelp32",
    "handleapi",
    "winsock2",
    "iphlpapi",
    "ipmib",
    "winerror",
    "fileapi",
    "ioapiset",
    "winbase",
    "namedpipeapi",
    "processthreadsapi",
    "winnt",
    "winsvc",
    "shellapi",
    "sysinfoapi",
    "synchapi",
    "winuser",
    "jobapi2",
] }
ipconfig = "0.3"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
