<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b0d10" />
    <meta
      name="description"
      content="Keel is a desktop workspace for running and organizing multiple AI coding agents."
    />
    <title>Keel</title>
    <style>
      /* Painted before React boots so the window never flashes white. Only
         #root carries the ground: html and body stay clear so the shell can
         fade to the desktop when the window is not the one you are in. */
      html,
      body {
        margin: 0;
        height: 100%;
      }
      #root {
        height: 100%;
        background-color: var(--keel-void, #0a0a0a);
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
